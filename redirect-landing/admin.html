<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirect links — Admin</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { align-items: flex-start; padding: 2rem; }
    #admin { max-width: 36rem; margin: 0 auto; text-align: left; }
    #admin h1 { margin-bottom: 0.5rem; }
    #admin .sub { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.25rem; color: var(--text-body); font-size: 0.875rem; }
    .form-group input { width: 100%; padding: 0.5rem 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border-subtle); background: rgba(255,255,255,0.06); color: var(--text-primary); font-size: 1rem; }
    .form-group input::placeholder { color: var(--text-muted); }
    .form-group input:focus { outline: none; border-color: var(--brand-magenta); }
    .btn-block { width: 100%; }
    .message { margin-top: 1rem; padding: 0.75rem; border-radius: 0.5rem; font-size: 0.875rem; }
    .message.success { background: rgba(0,255,0,0.1); color: #86efac; }
    .message.error { background: rgba(255,0,0,0.1); color: #fca5a5; }
    .message.hidden { display: none; }
    .result-url { margin-top: 1rem; word-break: break-all; padding: 0.75rem; background: rgba(255,255,255,0.06); border-radius: 0.5rem; font-size: 0.875rem; color: var(--brand-light-orange); }
    .links-list { margin-top: 2rem; }
    .links-list h2 { font-size: 1.25rem; margin-bottom: 1rem; }
    .link-row { padding: 0.75rem; background: rgba(255,255,255,0.06); border-radius: 0.5rem; margin-bottom: 0.5rem; font-size: 0.875rem; }
    .link-row .slug { font-weight: 600; color: var(--brand-light-orange); }
    .link-row .url { color: var(--text-muted); word-break: break-all; }
    .link-row a { color: var(--brand-magenta); }
    .auth-hint { color: var(--text-muted); font-size: 0.75rem; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div id="admin">
    <h1 class="logo">Redirect links</h1>
    <p class="sub">Create and list redirect links. API auth required.</p>

    <div class="form-group">
      <label for="apiBase">API base URL</label>
      <input type="text" id="apiBase" placeholder="https://dev-api.altyr.com/v1 or http://localhost:3000/v1" />
    </div>
    <div class="form-group">
      <label for="token">Authorization token (JWT)</label>
      <input type="password" id="token" placeholder="Paste your JWT or Bearer token" />
      <p class="auth-hint">Required for create and list. Stored in sessionStorage for this tab.</p>
    </div>

    <h2 style="font-size: 1.125rem; margin: 1.5rem 0 0.75rem;">Create link</h2>
    <div class="form-group">
      <label for="creatorName">Creator name (optional)</label>
      <input type="text" id="creatorName" placeholder="e.g. jane_creator" />
    </div>
    <div class="form-group">
      <label for="onlyfansUrl">OnlyFans URL (required)</label>
      <input type="url" id="onlyfansUrl" placeholder="https://onlyfans.com/username" />
    </div>
    <button type="button" id="btnCreate" class="btn btn-primary btn-block">Create link</button>
    <div id="createMessage" class="message hidden"></div>
    <div id="createResult" class="result-url hidden"></div>

    <div class="links-list">
      <h2>Existing links</h2>
      <button type="button" id="btnList" class="btn btn-secondary" style="margin-bottom: 1rem;">Refresh list</button>
      <div id="listMessage" class="message hidden"></div>
      <div id="listResult"></div>
    </div>
  </div>
  <script>
    window.REDIRECT_API_BASE = window.REDIRECT_API_BASE || 'http://localhost:3000/v1';
  </script>
  <script src="admin.js"></script>
</body>
</html>
