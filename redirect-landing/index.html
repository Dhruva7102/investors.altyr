<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Altyr</title>
    <meta http-equiv="refresh" content="0; url=https://go.altyr.com/" />
    <script>
      // Preserve the slug when someone lands on a stale /g/:slug URL that
      // didn't hit the vercel.json redirect (e.g. local dev, direct hits).
      (function () {
        var path = window.location.pathname || ''
        var match = path.match(/^\/g\/([^\/?#]+)/)
        var slug = match ? match[1] : ''
        var target = 'https://go.altyr.com/' + slug
        window.location.replace(target)
      })()
    </script>
  </head>
  <body>
    <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;background:#000;">
      <p>
        Redirecting&hellip; If you are not redirected automatically,
        <a href="https://go.altyr.com/" style="color:#e08a38;">click here</a>.
      </p>
    </main>
  </body>
</html>
