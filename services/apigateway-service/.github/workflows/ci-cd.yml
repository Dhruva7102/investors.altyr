name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'  # Run on all branches
  pull_request:
    branches:
      - '**'  # Run on all PRs

env:
  IMAGE_NAME: 'fanzly-altyr-apigateway-service'

jobs:

  build-and-push-prod:
    name: Build and Push Docker Image (Production)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Extract version from Makefile
        id: makefile_version
        run: |
          VERSION=$(grep -m 1 "^VERSION :=" Makefile | sed 's/^.*= //g' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted VERSION from Makefile: $VERSION"

      - name: Build Docker image using Makefile
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          make docker REPO_NAME=${IMAGE_NAME}

      - name: Tag and push Docker images
        run: |
          # The Makefile builds the image as ${IMAGE_NAME}:${VERSION} (e.g., 2.12.0)
          # Create additional tags from the Makefile version
          docker tag ${IMAGE_NAME}:${{ steps.makefile_version.outputs.version }} ${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ steps.makefile_version.outputs.version }}
          # Push all tags
          docker push ${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ steps.makefile_version.outputs.version }}

  build-and-push-development:
    name: Build and Push Docker Image (Development)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Extract version from Makefile
        id: makefile_version
        run: |
          VERSION=$(grep -m 1 "^VERSION :=" Makefile | sed 's/^.*= //g' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted VERSION from Makefile: $VERSION"

      - name: Build Docker image using Makefile
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          make docker REPO_NAME=${IMAGE_NAME}

      - name: Tag and push Docker images
        run: |
          # The Makefile builds the image as ${IMAGE_NAME}:${VERSION} (e.g., 2.12.0)
          # Create additional tags from the Makefile version
          docker tag ${IMAGE_NAME}:${{ steps.makefile_version.outputs.version }} ${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ steps.makefile_version.outputs.version }}
          # Push all tags
          docker push ${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ steps.makefile_version.outputs.version }}
