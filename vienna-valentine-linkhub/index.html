<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<!-- Deliberately neutral metadata. Nothing here names an adult platform, so a
     link preview / crawler sees an ordinary personal links page. -->
<title>Vienna Valentine</title>
<meta name="description" content="All of Vienna Valentine's official links in one place." />
<meta name="theme-color" content="#0B0507" />
<meta name="color-scheme" content="dark" />

<!-- ⚠ After the domain is attached in Vercel, change the two og:image /
     twitter:image values below to the ABSOLUTE url (https://yourdomain.com/og.png).
     Some link-preview scrapers will not resolve a relative image path. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Vienna Valentine" />
<meta property="og:description" content="All of my links, in one place." />
<meta property="og:image" content="/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Vienna Valentine" />
<meta name="twitter:description" content="All of my links, in one place." />
<meta name="twitter:image" content="/og.png" />

<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="aurora" aria-hidden="true">
  <span class="blob blob--rose"></span>
  <span class="blob blob--wine"></span>
  <span class="blob blob--gold"></span>
</div>
<div class="grain" aria-hidden="true"></div>

<main class="shell">

  <header class="hero">
    <div class="avatar reveal" data-i="0">
      <span class="avatar__monogram" aria-hidden="true">VV</span>
      <img class="avatar__img" src="/img/avatar.jpg" alt="Vienna Valentine" width="120" height="120" data-fallback />
    </div>

    <h1 class="hero__name reveal" data-i="1">Vienna&nbsp;Valentine</h1>

    <p class="hero__handle reveal" data-i="2">
      <span class="dot" aria-hidden="true"></span>@vienavalentine
    </p>

    <p class="hero__bio reveal" data-i="3">
      Softly spoken. Occasionally trouble.
    </p>

    <div class="rule reveal" data-i="4" aria-hidden="true"></div>
  </header>

  <nav class="links" aria-label="My links">

    <!-- Primary destination. The href is a same-origin path; the real
         destination is resolved on /vip after a human tap. -->
    <a class="card card--primary reveal" data-i="5" href="/vip">
      <span class="card__pill">Start here</span>
      <span class="card__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
          <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
          <circle cx="12" cy="15.5" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="card__text">
        <span class="card__label">VIP Access</span>
        <span class="card__sub">Private gallery · Daily posts · DM me</span>
      </span>
      <span class="card__chev" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </span>
    </a>

    <a class="card reveal" data-i="6" href="https://x.com/vienavalentine" target="_blank" rel="noopener noreferrer me">
      <span class="card__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.53 3h3.2l-6.99 7.99L22 21h-6.44l-5.04-6.59L4.75 21H1.54l7.48-8.55L2 3h6.6l4.56 6.03L17.53 3Zm-1.12 16.06h1.77L7.67 4.85H5.77l10.64 14.21Z"/></svg>
      </span>
      <span class="card__text">
        <span class="card__label">X / Twitter</span>
        <span class="card__sub">@vienavalentine</span>
      </span>
      <span class="card__chev" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </span>
    </a>

    <a class="card reveal" data-i="7" href="https://www.instagram.com/allegedlyaspen/" target="_blank" rel="noopener noreferrer me">
      <span class="card__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5.2"/>
          <circle cx="12" cy="12" r="4.1"/>
          <circle cx="17.1" cy="6.9" r="1.15" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="card__text">
        <span class="card__label">Instagram</span>
        <span class="card__sub">@allegedlyaspen</span>
      </span>
      <span class="card__chev" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </span>
    </a>

    <!-- ── Add another link: copy this block, swap the href, icon and text. ──
    <a class="card reveal" data-i="8" href="https://t.me/yourhandle" target="_blank" rel="noopener noreferrer me">
      <span class="card__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4 3 11l5.5 2L11 20l3-4.5L19 19 21 4Z"/></svg>
      </span>
      <span class="card__text">
        <span class="card__label">Telegram</span>
        <span class="card__sub">Free channel</span>
      </span>
      <span class="card__chev" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </span>
    </a>
    ─────────────────────────────────────────────────────────────────────── -->

  </nav>

  <footer class="foot reveal" data-i="9">
    <p>© <span data-year>2026</span> Vienna Valentine</p>
  </footer>

</main>

<script src="/js/config.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
