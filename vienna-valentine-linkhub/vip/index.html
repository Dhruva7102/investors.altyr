<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<title>Vienna Valentine</title>
<meta name="theme-color" content="#0B0507" />
<meta name="color-scheme" content="dark" />
<meta name="referrer" content="no-referrer" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="aurora" aria-hidden="true">
  <span class="blob blob--rose"></span>
  <span class="blob blob--wine"></span>
</div>
<div class="grain" aria-hidden="true"></div>

<main class="gate">
  <div class="gate__panel">

    <div class="gate__seal" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
        <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
      </svg>
    </div>

    <h1 class="gate__title">One more step</h1>

    <p class="gate__copy">
      You're heading to my private page. Everything past this point is intended
      for adults only.
    </p>

    <button type="button" class="btn btn--go" id="go">
      <span id="go-label">I'm 18 or older — continue</span>
    </button>

    <a class="gate__back" href="/">Take me back</a>

    <p class="gate__fine" id="fine">
      By continuing you confirm you are of legal age in your country.
    </p>

  </div>
</main>

<script src="/js/config.js"></script>
<script src="/js/vip.js"></script>
</body>
</html>
