<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirect links — Admin</title>
  <style>
    :root {
      --bg: #18021A;
      --text-primary: rgba(255, 255, 255, 0.9);
      --text-body: rgba(255, 255, 255, 0.7);
      --text-muted: rgba(255, 255, 255, 0.5);
      --border: rgba(255, 255, 255, 0.12);
      --brand-magenta: #AC0064;
      --brand-light-orange: #FF8C42;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      align-items: flex-start;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    #admin { max-width: 36rem; width: 100%; text-align: left; }
    #admin h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      background: linear-gradient(90deg, #9B4DCA, #E85A24, #FF8C42);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    #admin .sub { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.25rem; color: var(--text-body); font-size: 0.875rem; }
    .form-group input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--text-primary);
      font-size: 1rem;
    }
    .form-group input::placeholder { color: var(--text-muted); }
    .form-group input:focus { outline: none; border-color: var(--brand-magenta); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 9999px;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-block { width: 100%; }
    .btn-primary {
      background: linear-gradient(90deg, #D4740C, #B56A00);
      color: white;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .message { margin-top: 1rem; padding: 0.75rem; border-radius: 0.5rem; font-size: 0.875rem; }
    .message.success { background: rgba(0,255,0,0.1); color: #86efac; }
    .message.error { background: rgba(255,0,0,0.1); color: #fca5a5; }
    .message.hidden { display: none; }
    .result-url {
      margin-top: 1rem;
      word-break: break-all;
      padding: 0.75rem;
      background: rgba(255,255,255,0.06);
      border-radius: 0.5rem;
      font-size: 0.875rem;
      color: var(--brand-light-orange);
    }
    .links-list { margin-top: 2rem; }
    .links-list h2 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--text-primary); }
    .link-row {
      padding: 0.75rem;
      background: rgba(255,255,255,0.06);
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }
    .link-row .slug { font-weight: 600; color: var(--brand-light-orange); }
    .link-row .url { color: var(--text-muted); word-break: break-all; }
    .link-row a { color: var(--brand-magenta); }
    .auth-hint { color: var(--text-muted); font-size: 0.75rem; margin-top: 0.25rem; }
    .toggle-settings { font-size: 0.875rem; color: var(--text-muted); cursor: pointer; margin-bottom: 0.5rem; }
    .toggle-settings:hover { color: var(--text-body); }
    .settings-panel { margin-bottom: 1rem; }
    .settings-panel.hidden { display: none; }
  </style>
</head>
<body>
  <div id="admin">
    <h1 class="logo">Redirect links</h1>
    <p class="sub">Enter OnlyFans URL and Altyr URL, then create your link.</p>

    <div class="form-group">
      <label for="onlyfansUrl">OnlyFans URL</label>
      <input type="url" id="onlyfansUrl" placeholder="https://onlyfans.com/username" />
    </div>
    <div class="form-group">
      <label for="altyrUrl">Altyr URL (optional)</label>
      <input type="url" id="altyrUrl" placeholder="https://dev.altyr.com or leave blank for default" />
    </div>
    <button type="button" id="btnCreate" class="btn btn-primary btn-block">Create link</button>
    <div id="createMessage" class="message hidden"></div>
    <div id="createResult" class="result-url hidden"></div>

    <p class="toggle-settings" id="toggleSettings">Settings (API URL)</p>
    <div class="settings-panel hidden" id="settingsPanel">
      <div class="form-group">
        <label for="apiBase">API base URL</label>
        <input type="text" id="apiBase" placeholder="https://dev-api.altyr.com/v1" />
        <p class="auth-hint">Leave blank to use https://dev-api.altyr.com/v1. Create and list use Basic auth (altyr / admin@altyr.com).</p>
      </div>
      <div class="form-group">
        <label for="adminSecret">Admin password (optional, legacy)</label>
        <input type="password" id="adminSecret" placeholder="Not used when using dev-api Basic auth" />
      </div>
    </div>

    <div class="links-list">
      <h2>Existing links</h2>
      <button type="button" id="btnList" class="btn btn-secondary" style="margin-bottom: 1rem;">Refresh list</button>
      <div id="listMessage" class="message hidden"></div>
      <div id="listResult"></div>
    </div>
  </div>
  <script>
    window.REDIRECT_API_BASE = window.REDIRECT_API_BASE || (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:3000/v1' : '');
  </script>
  <script src="/admin.js"></script>
</body>
</html>
